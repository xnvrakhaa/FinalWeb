
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile | STEPUP Sneaker Store</title>

    <link rel="stylesheet"
          href="./vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/assignment5.css">
    <link rel="stylesheet" href="./css/assignment6.css">
    <link rel="stylesheet" href="./css/auth.css">

    <script src="./js/theme.js" defer></script>
    <script src="./js/auth.js" defer></script>
</head>

<body>
<a class="skip-link px-3 py-2"
   href="#main-content">
    Skip to main content
</a>

<header id="main-header">
    <nav class="navbar bootstrap-nav navbar-expand-lg
                bg-dark py-3"
         data-bs-theme="dark"
         aria-label="Main navigation">

        <div class="container">
            <a class="navbar-brand text-warning fw-bold fs-3"
               href="index.html">
                STEPUP
            </a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainMenu"
                    aria-controls="mainMenu"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <button type="button"
                    class="btn btn-outline-warning ms-3"
                    id="theme-toggle"
                    aria-pressed="false">
                Day mode
            </button>

            <div class="collapse navbar-collapse"
                 id="mainMenu">
                <ul class="navbar-nav ms-auto gap-lg-3">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="catalog.html">
                            Catalog
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="gallery.html">
                            Gallery
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="about.html">
                            About Us
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">
                            Contact
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active fw-bold"
                           aria-current="page"
                           href="profile.html">
                            Profile
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<main id="main-content">
    <section class="auth-section">
        <div class="auth-card" id="profile-card" hidden>

            <p class="section-label">STEPUP MEMBER</p>
            <h1>My Profile</h1>

            <div class="profile-avatar"
                 aria-hidden="true">S</div>

            <h2 id="profile-welcome"></h2>

            <div class="profile-details">
                <p>
                    <strong>Full Name:</strong>
                    <span id="profile-name"></span>
                </p>

                <p>
                    <strong>Email:</strong>
                    <span id="profile-email"></span>
                </p>
            </div>

            <a class="button auth-submit auth-link-button"
               href="catalog.html">
                Explore Sneakers
            </a>

            <button
                    type="button"
                    class="button auth-submit"
                    id="logout-button">
                Log Out
            </button>

        </div>
    </section>
</main>

<footer>
    <p>
        Created by Tazhmaganbetov Rakhat
        and Tauekel Islam | Group SE-2508
    </p>
    <p>
        &copy; 2026 STEPUP Sneaker Store.
        All rights reserved.
    </p>
</footer>

</script>
